[workspace]
members = [
  "crates/core/application",
  "crates/core/domain",
  "crates/core/infrastructure",
  "crates/shared",
  "crates/web-api",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.99"
async-trait = "0.1.89"
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.8.6", features = [
  "runtime-tokio",
  "tls-rustls",
  "macros",
  "postgres",
  "chrono",
  "migrate",
] }
thiserror = "2.0.16"
tracing = { version = "0.1.41", features = ["log"] }
argon2 = "0.5.3"
axum = "0.8.4"
chrono = "0.4.41"
core-application = { path = "crates/core/application" }
core-domain = { path = "crates/core/domain" }
core-infrastructure = { path = "crates/core/infrastructure" }
fake = "4.4.0"
figment = "0.10.19"
http-body-util = "0.1.3"
jsonwebtoken = "9.3.1"
rand = "0.9.2"
secrecy = "0.10.3"
serde-aux = "4.7.0"
serde_json = "1.0.143"
shared = { path = "crates/shared" }
tokio = "1.47.1"
tower = "0.5.2"
tower-http = "0.6.6"
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-panic = "0.1.2"
tracing-subscriber = "0.3.20"
uuid = "1.18.1"
validator = "0.20.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
