[workspace]
members = [
  "crates/core/application",
  "crates/core/domain",
  "crates/core/infrastructure",
  "crates/shared",
  "crates/web-api",
]
resolver = "3"


[workspace.package]
version = "2.0.9"
edition = "2024"
authors = ["Muhammad Abdusy Syukur <hi@abdusy.dev>"]

[workspace.dependencies]
anyhow = "1.0.101"
async-trait = "0.1.89"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = [
  "runtime-tokio",
  "tls-rustls",
  "macros",
  "postgres",
  "chrono",
  "migrate",
] }
thiserror = "2.0.18"
tracing = { version = "0.1.44", features = ["log"] }
argon2 = "0.5.3"
axum = "0.8.8"
chrono = "0.4.43"
core-application = { path = "crates/core/application" }
core-domain = { path = "crates/core/domain" }
core-infrastructure = { path = "crates/core/infrastructure" }
fake = "4.4.0"
figment = "0.10.19"
http-body-util = "0.1.3"
jsonwebtoken = { version = "10.3.0", features = [
  "aws_lc_rs",
], default-features = false }
rand = "0.10.0"
secrecy = "0.10.3"
serde-aux = "4.7.0"
serde_json = "1.0.149"
shared = { path = "crates/shared" }
tokio = "1.49.0"
tower = "0.5.3"
tower-http = "0.6.8"
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-panic = "0.1.2"
tracing-subscriber = "0.3.22"
uuid = "1.21.0"
validator = "0.20.0"
base64 = "0.22.1"
hmac = "=0.13.0-rc.5"
sha2 = "=0.11.0-rc.5"
subtle = "2.6.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
