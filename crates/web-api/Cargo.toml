[package]
name = "rustatsu-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "rustatsu-sync"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http2", "macros"] }
chrono = { workspace = true }
core-application = { workspace = true }
core-domain = { workspace = true }
core-infrastructure = { workspace = true }
figment = { workspace = true, features = ["yaml", "env"] }
jsonwebtoken = { workspace = true }
shared = { workspace = true }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde-aux = { workspace = true }
serde_json = { workspace = true }
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
tower = { workspace = true }
tower-http = { workspace = true, features = [
  "compression-full",
  "trace",
  "request-id",
  "cors",
] }
tracing.workspace = true
tracing-bunyan-formatter = { workspace = true }
tracing-log = { workspace = true }
tracing-panic = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "registry",
  "env-filter",
  "json",
] }
validator = { workspace = true, features = ["derive"] }

[dev-dependencies]
rand = { workspace = true }
http-body-util = { workspace = true }
fake = { workspace = true, features = [
  "chrono",
  "email_address",
  "time",
  "url",
] }
uuid = { workspace = true, features = ["v4"] }
